PersonProfile:
  type: object
  required:
    - id
    - slug
    - displayName
    - aliases
  properties:
    id:
      type: string
    slug:
      type: string
    displayName:
      type: string
    aliases:
      type: array
      items:
        type: string
    bio:
      type:
        - string
        - 'null'
    hometown:
      type:
        - string
        - 'null'
    avatarUrl:
      type:
        - string
        - 'null'
    claimedByUserId:
      type:
        - string
        - 'null'
    calling:
      type: [string, 'null']
    age:
      type: [string, 'null']
    quote:
      type: [string, 'null']
    debut:
      type: [string, 'null']
    specializations:
      type: array
      items:
        type: object
        required: [type]
        properties:
          type: { type: string }
          attributes: { type: object, additionalProperties: true }
    customFields:
      type: array
      items:
        type: object
        required: [id, label, value]
        properties:
          id: { type: string }
          label: { type: string }
          value: { type: string }
    canonicalUrl:
      type: string
    shareTitle:
      type: string
    shareText:
      type: string
CreatePersonInput:
  type: object
  required:
    - displayName
  properties:
    displayName:
      type: string
      minLength: 1
      maxLength: 160
    bio:
      type: string
      maxLength: 10000
    aliases:
      type: array
      maxItems: 30
      items:
        type: string
        maxLength: 160
UpdatePersonInput:
  type: object
  required: []
  properties:
    displayName:
      type: string
      minLength: 1
      maxLength: 160
    bio:
      type: string
      maxLength: 10000
    aliases:
      type: array
      maxItems: 30
      items:
        type: string
        maxLength: 160
