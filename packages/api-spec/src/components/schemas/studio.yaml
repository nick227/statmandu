CardCompositionGradient:
  type: object
  additionalProperties: false
  required:
    - colors
  properties:
    type:
      type: string
      enum:
        - linear
        - radial
    colors:
      type: array
      items:
        type: string
    locations:
      type: array
      items:
        type: number
    start:
      type: object
      properties:
        x:
          type: number
        'y':
          type: number
    end:
      type: object
      properties:
        x:
          type: number
        'y':
          type: number
    angle:
      type: number

CardCompositionShadow:
  type: object
  additionalProperties: false
  properties:
    color:
      type: string
    offsetX:
      type: number
    offsetY:
      type: number
    blur:
      type: number
    opacity:
      type: number

CardCompositionMask:
  type: object
  additionalProperties: false
  properties:
    type:
      type: string
      enum:
        - rounded
        - arch
        - path
    borderRadius:
      type: number
    borderTopLeftRadius:
      type: number
    borderTopRightRadius:
      type: number
    borderBottomLeftRadius:
      type: number
    borderBottomRightRadius:
      type: number
    pathData:
      type: string

CardCompositionLayer:
  type: object
  additionalProperties: false
  required:
    - id
    - type
    - x
    - 'y'
    - width
    - height
  properties:
    id:
      type: string
      pattern: ^[a-zA-Z0-9_-]{1,80}$
    type:
      type: string
      enum:
        - TEXT
        - IMAGE
        - RECTANGLE
        - SVG
        - PATH
    x:
      type: number
      minimum: 0
    'y':
      type: number
      minimum: 0
    width:
      type: number
      minimum: 1
    height:
      type: number
      minimum: 1
    text:
      type: string
      maxLength: 4000
    personField:
      type: string
      enum:
        - displayName
        - bio
        - hometown
    imageAssetId:
      type: string
    fill:
      type: string
    fontSize:
      type: number
      minimum: 1
      maximum: 512
    fontRole:
      type: string
    allCaps:
      type: boolean
    bold:
      type: boolean
    italic:
      type: boolean
    tracking:
      type: number
    letterSpacing:
      type: number
    textAlign:
      type: string
      enum:
        - left
        - center
        - right
    lineHeight:
      type: number
    borderRadius:
      type: number
    borderWidth:
      type: number
    borderColor:
      type: string
    borderLeftWidth:
      type: number
    borderRightWidth:
      type: number
    borderTopWidth:
      type: number
    borderBottomWidth:
      type: number
    gradient:
      $ref: '#/CardCompositionGradient'
    shadow:
      $ref: '#/CardCompositionShadow'
    mask:
      $ref: '#/CardCompositionMask'
    opacity:
      type: number
      minimum: 0
      maximum: 1
    blendMode:
      type: string
      enum:
        - normal
        - multiply
        - screen
        - overlay
        - color-dodge
        - soft-light
    pathData:
      type: string
      maxLength: 8000
    viewBox:
      type: string
      maxLength: 80
    stroke:
      type: string
    strokeWidth:
      type: number
      minimum: 0
  description: >-
    Ordered back-to-front. TEXT requires exactly one text or personField. IMAGE requires an owned imageAssetId.
    RECTANGLE requires fill or gradient. SVG/PATH requires pathData. Bounds must fit the canvas. Text is plain text, never HTML.
CardCompositionCanvas:
  type: object
  additionalProperties: false
  required:
    - width
    - height
  properties:
    width:
      type: integer
      minimum: 1
      maximum: 4096
    height:
      type: integer
      minimum: 1
      maximum: 4096

CardFaceComposition:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - canvas
    - layers
  properties:
    schemaVersion:
      type: integer
      enum:
        - 1
    canvas:
      $ref: '#/CardCompositionCanvas'
    layers:
      type: array
      maxItems: 100
      items:
        $ref: ../../root.yaml#/components/schemas/CardCompositionLayer

CardComposition:
  type: object
  additionalProperties: false
  required:
    - schemaVersion
    - canvas
    - layers
  properties:
    schemaVersion:
      type: integer
      enum:
        - 1
    canvas:
      $ref: '#/CardCompositionCanvas'
    layers:
      type: array
      maxItems: 100
      items:
        $ref: ../../root.yaml#/components/schemas/CardCompositionLayer
    backComposition:
      $ref: '#/CardFaceComposition'
    metadata:
      type: object
      additionalProperties: true
CardDesign:
  type: object
  additionalProperties: false
  required:
    - id
    - createdByUserId
    - title
    - revision
    - rendererVersion
    - composition
    - archivedAt
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    createdByUserId:
      type: string
    title:
      type: string
    revision:
      type: integer
      minimum: 1
    rendererVersion:
      type: string
    composition:
      $ref: ../../root.yaml#/components/schemas/CardComposition
    archivedAt:
      type:
        - string
        - 'null'
      format: date-time
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
CreateCardDesignInput:
  type: object
  additionalProperties: false
  required:
    - title
    - composition
  properties:
    title:
      type: string
      minLength: 1
      maxLength: 160
    composition:
      $ref: ../../root.yaml#/components/schemas/CardComposition
UpdateCardDesignInput:
  type: object
  additionalProperties: false
  required:
    - expectedRevision
  properties:
    expectedRevision:
      type: integer
      minimum: 1
    title:
      type: string
      minLength: 1
      maxLength: 160
    composition:
      $ref: ../../root.yaml#/components/schemas/CardComposition
    archived:
      type: boolean
CreateReleaseInput:
  type: object
  additionalProperties: false
  required:
    - templateId
    - expectedRevision
    - personProfileId
    - title
    - editionMode
    - requestId
  properties:
    templateId:
      type: string
    expectedRevision:
      type: integer
      minimum: 1
    personProfileId:
      type: string
    title:
      type: string
      minLength: 1
      maxLength: 160
    editionMode:
      $ref: ./cards.yaml#/CardEditionMode
    editionSize:
      type:
        - integer
        - 'null'
      minimum: 1
    requestId:
      type: string
      minLength: 1
      maxLength: 100
    sourceImageAssetId:
      type:
        - string
        - 'null'
CardRelease:
  allOf:
    - $ref: ../../root.yaml#/components/schemas/Card
Storefront:
  type: object
  additionalProperties: false
  required:
    - id
    - userId
    - username
    - displayName
    - avatarUrl
    - description
    - commerceEnabled
    - createdAt
    - updatedAt
  properties:
    id:
      type: string
    userId:
      type: string
    username:
      type:
        - string
        - 'null'
    displayName:
      type:
        - string
        - 'null'
    avatarUrl:
      type:
        - string
        - 'null'
    description:
      type:
        - string
        - 'null'
    commerceEnabled:
      type: boolean
      enum:
        - false
    createdAt:
      type: string
      format: date-time
    updatedAt:
      type: string
      format: date-time
UpdateStorefrontInput:
  type: object
  additionalProperties: false
  required:
    - description
  properties:
    description:
      type:
        - string
        - 'null'
      maxLength: 2000
CardDesignSnapshot:
  type: object
  required:
    - schemaVersion
    - templateId
    - revision
    - rendererVersion
    - composition
    - person
    - assets
    - assetIds
  properties:
    schemaVersion:
      type: integer
      enum:
        - 1
    templateId:
      type: string
    revision:
      type: integer
    rendererVersion:
      type: string
    composition:
      $ref: '#/CardComposition'
    person:
      $ref: ./people.yaml#/PersonProfile
    assetIds:
      type: array
      items:
        type: string
    assets:
      type: array
      items:
        type: object
        required:
          - id
          - objectKey
          - url
          - contentType
          - byteSize
        properties:
          id:
            type: string
          objectKey:
            type: string
          url:
            type: string
          contentType:
            type: string
          byteSize:
            type: integer
