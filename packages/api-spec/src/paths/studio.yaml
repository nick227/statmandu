route0:
  post:
    operationId: createCardDesign
    summary: create Card Design
    tags:
      - cards
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: '../root.yaml#/components/schemas/CreateCardDesignInput'
    responses:
      '201':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  $ref: '../root.yaml#/components/schemas/CardDesign'
      default:
        description: Request failed
        content:
          application/json:
            schema:
              $ref: '../root.yaml#/components/schemas/ErrorResponse'
  get:
    operationId: listCardDesigns
    summary: list Card Designs
    tags:
      - cards
    responses:
      '200':
        description: Success
        content:
          application/json:
            schema:
              type: object
              required:
                - data
              properties:
                data:
                  type: array
                  items:
                    $ref: '../root.yaml#/components/schemas/CardDesign'
      default:
        description: Request failed
        content:
          application/json:
            schema:
              $ref: '../root.yaml#/components/schemas/ErrorResponse'
